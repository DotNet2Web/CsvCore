name: Build

on:
  push:
    branches:
      - 'main'
    tags:
      - '*'
  pull_request:

jobs:
  build:
    name: "Build, Test, Analyze and Publish"
    runs-on: windows-latest

    permissions:
      id-token: write   # required for NuGet Trusted Publishing OIDC
      contents: read

    env:
      DOTNET_NOLOGO: false

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: NuGet login (OIDC → temp API key)
        if: startsWith(github.ref, 'refs/tags/')
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: DotNet2Web

      - name: Run NUKE
        run: ./build.ps1
        env:
          NuGetApiKey: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}

      - name: Check for 'lcov.info' existence
        id: check_files
        uses: andstor/file-existence-action@v3
        with:
          files: "TestResults/reports/lcov.info"

      - name: coveralls
        uses: coverallsapp/github-action@v2
        if: steps.check_files.outputs.files_exists == 'true'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: TestResults/reports/lcov.info

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            ./Artifacts/*
            ./TestResults/*.trx

  publish-test-results:
    name: "Publish Tests Results"
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    if: always()

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          comment_mode: always
          files: "artifacts/**/**/*.trx"
